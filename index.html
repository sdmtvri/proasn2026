    // Handle name selection change
    document.getElementById('nama').addEventListener('change', function() {
      const selectedName = this.value;
      
      if (selectedName && employeeDatabase[selectedName]) {
        const employee = employeeDatabase[selectedName];
        document.getElementById('nip').value = employee.nip;
        document.getElementById('jabatan').value = employee.jabatan;
        document.getElementById('satker').value = employee.satker;
        
        showSuccess('Data pegawai berhasil dimuat!');
      } else {
        document.getElementById('nip').value = '';
        document.getElementById('jabatan').value = '';
        document.getElementById('satker').value = '';
      }
    });

    // Initialize camera
    async function initCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('cameraOverlay').style.display = 'flex';
        document.getElementById('cameraOverlay').innerHTML = '<span>Mengaktifkan kamera...</span>';

        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: { ideal: currentFacingMode }, 
            width: { ideal: 640 }, 
            height: { ideal: 480 } 
          } 
        });
        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play().catch(() => {});
        document.getElementById('cameraOverlay').style.display = 'none';
      } catch (err) {
        console.error('Camera error:', err);
        document.getElementById('cameraOverlay').style.display = 'flex';
        document.getElementById('cameraOverlay').innerHTML = '<span>❌ Kamera tidak tersedia</span>';
        showError('Tidak dapat mengakses kamera. Pastikan Anda memberikan izin akses kamera.');
      }
    }

    // Switch camera (front <-> rear)
    document.getElementById('switchCameraBtn').addEventListener('click', async function() {
      const btn = this;
      btn.disabled = true;
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      await initCamera();
      btn.disabled = false;
    });

    // Capture photo
    document.getElementById('captureBtn').addEventListener('click', function() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const context = canvas.getContext('2d');
      
      // Check if video is ready
      if (video.readyState !== video.HAVE_ENOUGH_DATA) {
        showError('Kamera belum siap. Silakan tunggu sebentar.');
        return;
      }
      
      // Set canvas size to match video
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      
      // Draw the current frame
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // Convert to base64
      capturedImage = canvas.toDataURL('image/jpeg', 0.8);
      
      // Switch display
      video.style.display = 'none';
      canvas.style.display = 'block';
      document.getElementById('captureBtn').style.display = 'none';
      document.getElementById('switchCameraBtn').style.display = 'none';
      document.getElementById('retakeBtn').style.display = 'block';
      
      showSuccess('Foto berhasil diambil!');
    });

    // Retake photo
    document.getElementById('retakeBtn').addEventListener('click', function() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      
      video.style.display = 'block';
      canvas.style.display = 'none';
      document.getElementById('captureBtn').style.display = 'block';
      document.getElementById('switchCameraBtn').style.display = 'inline-flex';
      document.getElementById('retakeBtn').style.display = 'none';
      capturedImage = null;
    });

    // Form submission
    document.getElementById('employeeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      if (!capturedImage) {
        showError('Silakan ambil foto terlebih dahulu');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>⏳ Mengirim data...</span>';

      const formData = {
        nama: document.getElementById('nama').value,
        nip: document.getElementById('nip').value,
        jabatan: document.getElementById('jabatan').value,
        satker: document.getElementById('satker').value,
        foto: capturedImage,
        timestamp: new Date().toLocaleString('id-ID', { 
            year: 'numeric', 
            month: '2-digit', 
            day: '2-digit',
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit',
            hour12: false 
        })
      };

      try {
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoi6AVfXtYhzTPXOpJ8pi0HGLxmzQ7iP_fiMBoX_vshitSlBrdih8czA_4M5nJB-BK/exec';
        
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData)
        });

        showSuccess('Data berhasil dikirim ke Google Spreadsheet!');
        
        // Reset form
        document.getElementById('employeeForm').reset();
        document.getElementById('retakeBtn').click();
        
      } catch (error) {
        showError('Gagal mengirim data. Periksa koneksi internet dan URL Google Apps Script Anda.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    });

    function showSuccess(message) {
      const successMsg = document.getElementById('successMessage');
      successMsg.textContent = message;
      successMsg.style.display = 'block';
      setTimeout(() => {
        successMsg.style.display = 'none';
      }, 5000);
    }

    function showError(message) {
      const errorMsg = document.getElementById('errorMessage');
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
      setTimeout(() => {
        errorMsg.style.display = 'none';
      }, 5000);
    }

    // Element SDK Implementation
    async function onConfigChange(config) {
      document.getElementById('formTitle').textContent = config.form_title || defaultConfig.form_title;
      document.getElementById('subtitle').textContent = config.subtitle || defaultConfig.subtitle;
      document.getElementById('submitButtonText').textContent = config.submit_button_text || defaultConfig.submit_button_text;
      
      const backgroundColor = config.background_color || defaultConfig.background_color;
      const cardColor = config.card_color || defaultConfig.card_color;
      const primaryButtonColor = config.primary_button_color || defaultConfig.primary_button_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const accentColor = config.accent_color || defaultConfig.accent_color;
      
      document.querySelector('.form-container').style.background = `linear-gradient(135deg, ${backgroundColor} 0%, ${primaryButtonColor} 100%)`;
      document.querySelector('.form-card').style.background = cardColor;
      document.getElementById('formTitle').style.color = textColor;
      document.getElementById('submitBtn').style.background = `linear-gradient(to right, ${primaryButtonColor}, ${accentColor})`;
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.card_color || defaultConfig.card_color,
            set: (value) => {
              config.card_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ card_color: value });
            }
          },
          {
            get: () => config.primary_button_color || defaultConfig.primary_button_color,
            set: (value) => {
              config.primary_button_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ primary_button_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.accent_color || defaultConfig.accent_color,
            set: (value) => {
              config.accent_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ accent_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["form_title", config.form_title || defaultConfig.form_title],
        ["subtitle", config.subtitle || defaultConfig.subtitle],
        ["submit_button_text", config.submit_button_text || defaultConfig.submit_button_text]
      ]);
    }

    // Initialize SDK and camera when ready
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }

    initCamera();

    // Cleanup camera when page unloads
    window.addEventListener('beforeunload', () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });
