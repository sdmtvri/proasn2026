<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi ProASN TVRI 2026</title>
  <link rel="icon" type="image/png" href="https://sdmtvri.github.io/portal_ujian/assets/logotvri.png">
  <link rel="apple-touch-icon" href="https://sdmtvri.github.io/portal_ujian/assets/logotvri.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="pegawai.js"></script>
  <style>
    *,
    *::before,
    *::after {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Izinkan input pencarian nama tetap bisa diedit/diketik */
    input:not([readonly]) {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #081325;
      background-image:
        radial-gradient(at 50% 0%, #162f55 0%, transparent 65%),
        radial-gradient(at 100% 100%, #0c1a30 0%, transparent 50%),
        radial-gradient(at 0% 100%, #060e1c 0%, transparent 50%);
      background-attachment: fixed;
      color: #0f172a;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .form-container {
      min-height: 100vh;
      width: 100%;
      padding: 2.5rem 1rem 3.5rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    .header-section {
      width: 100%;
      max-width: 580px;
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      transition: transform 0.25s ease;
    }

    .logo-container:hover {
      transform: scale(1.03);
    }

    .logo-img {
      height: 72px;
      width: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 1.5px rgba(255, 255, 255, 0.85)) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }

    .form-card {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 1.25rem;
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow:
        0 25px 50px -12px rgba(3, 10, 26, 0.5),
        0 4px 12px rgba(0, 0, 0, 0.05);
      padding: 2.25rem;
    }

    @media (max-width: 640px) {
      .form-container {
        padding: 1.5rem 0.875rem 2.5rem 0.875rem;
      }

      .form-card {
        padding: 1.5rem 1.25rem;
        border-radius: 1rem;
      }

      .logo-img {
        height: 56px;
      }

      .logo-container {
        margin-bottom: 1rem;
      }
    }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      background: #0f172a;
      border-radius: 0.875rem;
      overflow: hidden;
      aspect-ratio: 3/4;
      border: 1px solid #cbd5e1;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
    }

    #video,
    #canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvas {
      display: none;
    }

    .camera-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      font-size: 0.95rem;
      font-weight: 500;
      backdrop-filter: blur(2px);
    }

    .success-message {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      padding: 0.875rem 1rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      display: none;
      text-align: center;
      font-size: 0.925rem;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .error-message {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      padding: 0.875rem 1rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      display: none;
      text-align: center;
      font-size: 0.925rem;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
  </style>
  <style>
    @view-transition {
      navigation: auto;
    }
  </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
</head>

<body>
  <div class="form-container">
    <!-- Header outside the card -->
    <header class="header-section">
      <div class="logo-container">
        <img src="https://sdmtvri.github.io/portal_ujian/assets/logotvri.png" alt="Logo TVRI" class="logo-img">
      </div>
      <h1 id="formTitle" class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight mb-2 drop-shadow-sm">
        Presensi ProASN TVRI 2026
      </h1>
      <p id="subtitle" class="text-slate-300 text-sm sm:text-base font-normal max-w-md mx-auto leading-relaxed">
        Lembaga Penyiaran Publik Televisi Republik Indonesia
      </p>
    </header>

    <!-- The White Card -->
    <main class="form-card">
      <div class="success-message" id="successMessage"></div>
      <div class="error-message" id="errorMessage"></div>

      <form id="employeeForm">
        <!-- Input Nama Pegawai -->
        <div class="mb-5 relative" id="namaContainer">
          <label for="nama" class="block text-sm font-semibold text-slate-700 mb-2">
            Nama Lengkap <span class="text-xs font-normal text-blue-600">(Ketik nama/satker untuk mencari)</span>
          </label>
          <div class="relative">
            <input type="text" id="nama" name="nama" required autocomplete="off" autocapitalize="words"
              placeholder="Ketik nama untuk mencari..."
              class="w-full pl-11 pr-10 py-3 border border-slate-300 rounded-xl focus:border-blue-600 focus:ring-4 focus:ring-blue-500/15 focus:outline-none transition-all text-slate-800 placeholder-slate-400 bg-white font-medium text-sm sm:text-base shadow-sm">
            <span
              class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-base">🔍</span>
            <button type="button" id="clearNamaBtn"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 p-1.5 rounded-full transition-colors hidden"
              title="Hapus pencarian">✕</button>
          </div>
          <div id="namaDropdown"
            class="absolute left-0 right-0 top-full mt-1.5 bg-white border border-slate-200 rounded-xl shadow-2xl max-h-60 overflow-y-auto z-50 hidden divide-y divide-slate-100"
            style="-webkit-overflow-scrolling: touch;">
          </div>
        </div>

        <!-- NIP -->
        <div class="mb-5">
          <label for="nip" class="block text-sm font-semibold text-slate-700 mb-1.5">NIP</label>
          <input type="text" id="nip" readonly required
            class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50/90 text-slate-600 font-mono text-sm cursor-not-allowed transition-colors"
            placeholder="Akan terisi otomatis">
        </div>

        <!-- Jabatan -->
        <div class="mb-5">
          <label for="jabatan" class="block text-sm font-semibold text-slate-700 mb-1.5">Jabatan</label>
          <input type="text" id="jabatan" readonly required
            class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50/90 text-slate-600 text-sm cursor-not-allowed transition-colors"
            placeholder="Akan terisi otomatis">
        </div>

        <!-- Satuan Kerja -->
        <div class="mb-6">
          <label for="satker" class="block text-sm font-semibold text-slate-700 mb-1.5">Satuan Kerja</label>
          <input type="text" id="satker" readonly required
            class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50/90 text-slate-600 text-sm cursor-not-allowed transition-colors"
            placeholder="Akan terisi otomatis">
        </div>

        <!-- Foto Presensi -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-slate-700 mb-2.5">Foto Presensi</label>
          <div class="camera-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
            <div class="camera-overlay" id="cameraOverlay"><span>Mengaktifkan kamera...</span></div>
          </div>
          <div class="flex gap-2 sm:gap-3 mt-4">
            <button type="button" id="switchCameraBtn"
              class="inline-flex items-center justify-center gap-2 px-3.5 sm:px-4 py-2.5 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-slate-700 text-sm font-medium rounded-xl border border-slate-200 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400/20 cursor-pointer shadow-none"
              title="Ganti Kamera Depan / Belakang">
              <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span>Ganti Kamera</span>
            </button>
            <button type="button" id="captureBtn"
              class="flex-1 inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-sm sm:text-base font-medium rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500/25 shadow-sm cursor-pointer">
              <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span>Ambil Foto</span>
            </button>
            <button type="button" id="retakeBtn"
              class="flex-1 items-center justify-center gap-2 px-5 py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 text-sm sm:text-base font-medium rounded-xl border border-slate-200 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400/20 shadow-none cursor-pointer"
              style="display: none;">
              <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span>Ambil Ulang</span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn"
          class="w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-base rounded-xl transition-all duration-150 shadow-sm hover:shadow focus:outline-none focus:ring-4 focus:ring-blue-500/20 disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">
          <svg class="w-5 h-5 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span id="submitButtonText">Kirim Data Presensi</span>
        </button>
      </form>
    </main>

    <!-- Footer -->
    <footer class="text-center mt-8 space-y-1 pb-4">
      <p class="text-slate-400 font-medium text-sm">©2026 SDM TVRI</p>
      <p class="text-slate-500 text-xs">Lembaga Penyiaran Publik Televisi Republik Indonesia</p>
    </footer>

  </div>
  <script>
    const defaultConfig = {
      form_title: "Presensi ProASN TVRI 2026",
      subtitle: "Lembaga Penyiaran Publik Televisi Republik Indonesia",
      submit_button_text: "Kirim Data Presensi",
      background_color: "#081325",
      card_color: "#ffffff",
      primary_button_color: "#2563eb",
      text_color: "#ffffff",
      accent_color: "#1d4ed8"
    };

    let stream = null;
    let capturedImage = null;
    let currentFacingMode = 'environment';

    // Database pegawai dimuat dari file pegawai.js


    // Autocomplete Search for Nama Pegawai
    const namaInput = document.getElementById('nama');
    const namaDropdown = document.getElementById('namaDropdown');
    const namaContainer = document.getElementById('namaContainer');
    const clearNamaBtn = document.getElementById('clearNamaBtn');
    let highlightedIndex = -1;
    let currentFilteredNames = [];

    function openDropdown() {
      namaDropdown.classList.remove('hidden');
    }

    function closeDropdown() {
      namaDropdown.classList.add('hidden');
      highlightedIndex = -1;
    }

    function renderSuggestions(query = '') {
      const allNames = Object.keys(employeeDatabase);
      const q = query.trim().toLowerCase();

      // Filter by name or satker
      currentFilteredNames = q
        ? allNames.filter(n => {
          const emp = employeeDatabase[n];
          return n.toLowerCase().includes(q) || (emp && emp.satker.toLowerCase().includes(q));
        })
        : allNames;

      namaDropdown.innerHTML = '';
      highlightedIndex = -1;

      if (currentFilteredNames.length === 0) {
        namaDropdown.innerHTML = `
          <div class="px-4 py-3 text-sm text-gray-500 text-center">
            Nama pegawai tidak ditemukan
          </div>
        `;
        return;
      }

      const fragment = document.createDocumentFragment();
      currentFilteredNames.forEach((name, index) => {
        const emp = employeeDatabase[name];
        const item = document.createElement('div');
        item.className = 'suggestion-item px-4 py-3 hover:bg-blue-50/80 active:bg-blue-100/70 cursor-pointer transition-colors text-left';
        item.setAttribute('data-name', name);
        item.setAttribute('data-index', index);

        // Highlight matching query
        let displayName = name;
        if (q) {
          const matchIndex = name.toLowerCase().indexOf(q);
          if (matchIndex !== -1) {
            const before = name.substring(0, matchIndex);
            const match = name.substring(matchIndex, matchIndex + q.length);
            const after = name.substring(matchIndex + q.length);
            displayName = `${before}<mark class="bg-blue-100 text-blue-900 font-semibold rounded px-1">${match}</mark>${after}`;
          }
        }

        item.innerHTML = `
          <div class="font-semibold text-slate-800 text-sm">${displayName}</div>
          <div class="text-xs text-slate-500 truncate mt-0.5">${emp.satker} • ${emp.jabatan}</div>
        `;
        fragment.appendChild(item);
      });
      namaDropdown.appendChild(fragment);
    }

    function selectEmployee(name) {
      const emp = employeeDatabase[name];
      if (!emp) return;
      namaInput.value = name;
      document.getElementById('nip').value = emp.nip;
      document.getElementById('jabatan').value = emp.jabatan;
      document.getElementById('satker').value = emp.satker;
      clearNamaBtn.classList.remove('hidden');
      closeDropdown();
      showSuccess('Data pegawai berhasil dimuat!');
    }

    function updateHighlight(items) {
      items.forEach((item, idx) => {
        if (idx === highlightedIndex) {
          item.classList.add('bg-blue-50');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.classList.remove('bg-blue-50');
        }
      });
    }

    namaInput.addEventListener('focus', function () {
      renderSuggestions(this.value);
      openDropdown();
    });

    namaInput.addEventListener('input', function () {
      const val = this.value;
      if (val) {
        clearNamaBtn.classList.remove('hidden');
      } else {
        clearNamaBtn.classList.add('hidden');
      }

      if (employeeDatabase[val]) {
        const emp = employeeDatabase[val];
        document.getElementById('nip').value = emp.nip;
        document.getElementById('jabatan').value = emp.jabatan;
        document.getElementById('satker').value = emp.satker;
      } else {
        document.getElementById('nip').value = '';
        document.getElementById('jabatan').value = '';
        document.getElementById('satker').value = '';
      }

      renderSuggestions(val);
      openDropdown();
    });

    namaInput.addEventListener('keydown', function (e) {
      const items = namaDropdown.querySelectorAll('.suggestion-item');
      if (namaDropdown.classList.contains('hidden') || items.length === 0) {
        if (e.key === 'ArrowDown') {
          renderSuggestions(this.value);
          openDropdown();
        }
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        highlightedIndex = (highlightedIndex + 1) % items.length;
        updateHighlight(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        highlightedIndex = (highlightedIndex - 1 + items.length) % items.length;
        updateHighlight(items);
      } else if (e.key === 'Enter') {
        if (highlightedIndex >= 0 && highlightedIndex < items.length) {
          e.preventDefault();
          const selected = items[highlightedIndex].getAttribute('data-name');
          selectEmployee(selected);
        }
      } else if (e.key === 'Escape') {
        closeDropdown();
      }
    });

    // Handle suggestion click & prevent blur on desktop mouse click
    namaDropdown.addEventListener('mousedown', function (e) {
      e.preventDefault();
    });

    namaDropdown.addEventListener('click', function (e) {
      const item = e.target.closest('[data-name]');
      if (item) {
        selectEmployee(item.getAttribute('data-name'));
      }
    });

    // Clear input button
    clearNamaBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      namaInput.value = '';
      document.getElementById('nip').value = '';
      document.getElementById('jabatan').value = '';
      document.getElementById('satker').value = '';
      clearNamaBtn.classList.add('hidden');
      renderSuggestions('');
      openDropdown();
      namaInput.focus();
    });

    // Close dropdown when tapping/clicking outside
    document.addEventListener('pointerdown', function (e) {
      if (!namaContainer.contains(e.target)) {
        closeDropdown();
      }
    });

    // Initialize camera
    async function initCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('cameraOverlay').style.display = 'flex';
        document.getElementById('cameraOverlay').innerHTML = '<span>Mengaktifkan kamera...</span>';

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: currentFacingMode },
            width: { ideal: 480 },
            height: { ideal: 640 },
            aspectRatio: { ideal: 3 / 4 }
          }
        });
        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play().catch(() => { });
        document.getElementById('cameraOverlay').style.display = 'none';
      } catch (err) {
        console.error('Camera error:', err);
        document.getElementById('cameraOverlay').style.display = 'flex';
        document.getElementById('cameraOverlay').innerHTML = '<span>❌ Kamera tidak tersedia</span>';
        showError('Tidak dapat mengakses kamera. Pastikan Anda memberikan izin akses kamera.');
      }
    }

    // Switch camera (front <-> rear)
    document.getElementById('switchCameraBtn').addEventListener('click', async function () {
      const btn = this;
      btn.disabled = true;
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      await initCamera();
      btn.disabled = false;
    });

    // Capture photo
    document.getElementById('captureBtn').addEventListener('click', function () {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const context = canvas.getContext('2d');

      // Check if video is ready
      if (video.readyState !== video.HAVE_ENOUGH_DATA) {
        showError('Kamera belum siap. Silakan tunggu sebentar.');
        return;
      }

      // Output tepat 480x640 (rasio 3:4) presisi sesuai tampilan preview
      const targetWidth = 480;
      const targetHeight = 640;
      const targetRatio = targetWidth / targetHeight; // 0.75

      const videoWidth = video.videoWidth || targetWidth;
      const videoHeight = video.videoHeight || targetHeight;
      const videoRatio = videoWidth / videoHeight;

      let srcX = 0;
      let srcY = 0;
      let srcW = videoWidth;
      let srcH = videoHeight;

      // Jika rasio video berbeda dari 3:4 (misal saat dibuka di webcam laptop yang lanskap),
      // lakukan center-crop agar apa yang tersimpan persis dengan yang terlihat di kotak preview
      if (Math.abs(videoRatio - targetRatio) > 0.02) {
        if (videoRatio > targetRatio) {
          srcW = videoHeight * targetRatio;
          srcX = (videoWidth - srcW) / 2;
        } else {
          srcH = videoWidth / targetRatio;
          srcY = (videoHeight - srcH) / 2;
        }
      }

      canvas.width = targetWidth;
      canvas.height = targetHeight;
      context.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, targetWidth, targetHeight);

      // Convert to base64
      capturedImage = canvas.toDataURL('image/jpeg', 0.8);

      // Switch display
      video.style.display = 'none';
      canvas.style.display = 'block';
      document.getElementById('captureBtn').style.display = 'none';
      document.getElementById('switchCameraBtn').style.display = 'none';
      document.getElementById('retakeBtn').style.display = 'inline-flex';

      showSuccess('Foto berhasil diambil!');
    });

    // Retake photo
    document.getElementById('retakeBtn').addEventListener('click', function () {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');

      video.style.display = 'block';
      canvas.style.display = 'none';
      document.getElementById('captureBtn').style.display = 'inline-flex';
      document.getElementById('switchCameraBtn').style.display = 'inline-flex';
      document.getElementById('retakeBtn').style.display = 'none';
      capturedImage = null;
    });

    // Form submission
    document.getElementById('employeeForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      if (!capturedImage) {
        showError('Silakan ambil foto terlebih dahulu');
        return;
      }

      const selectedName = document.getElementById('nama').value.trim();
      if (!selectedName || !employeeDatabase[selectedName]) {
        showError('Silakan ketik dan pilih nama pegawai yang terdaftar dari daftar.');
        document.getElementById('nama').focus();
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="w-5 h-5 animate-spin text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Mengirim data...</span>
      `;

      const formData = {
        nama: document.getElementById('nama').value,
        nip: document.getElementById('nip').value,
        jabatan: document.getElementById('jabatan').value,
        satker: document.getElementById('satker').value,
        foto: capturedImage,
        timestamp: new Date().toLocaleString('id-ID', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        })
      };

      try {
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcTpfUjfQXG9e7yAPC_i33ChlmBhoYRnTBzU5BqEuqoePOKIFmWpt00ljPKPTJZCtOFg/exec';

        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
          body: JSON.stringify(formData)
        });

        showSuccess('Data berhasil dikirim ke Google Spreadsheet!');

        // Reset form
        document.getElementById('employeeForm').reset();
        clearNamaBtn.classList.add('hidden');
        closeDropdown();
        document.getElementById('retakeBtn').click();

      } catch (error) {
        showError('Gagal mengirim data. Periksa koneksi internet dan URL Google Apps Script Anda.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    });

    function showSuccess(message) {
      const successMsg = document.getElementById('successMessage');
      successMsg.textContent = message;
      successMsg.style.display = 'block';
      setTimeout(() => {
        successMsg.style.display = 'none';
      }, 5000);
    }

    function showError(message) {
      const errorMsg = document.getElementById('errorMessage');
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
      setTimeout(() => {
        errorMsg.style.display = 'none';
      }, 5000);
    }

    // Element SDK Implementation
    async function onConfigChange(config) {
      if (document.getElementById('formTitle')) {
        document.getElementById('formTitle').textContent = config.form_title || defaultConfig.form_title;
        document.getElementById('formTitle').style.color = config.text_color || defaultConfig.text_color;
      }
      if (document.getElementById('subtitle')) {
        document.getElementById('subtitle').textContent = config.subtitle || defaultConfig.subtitle;
      }
      if (document.getElementById('submitButtonText')) {
        document.getElementById('submitButtonText').textContent = config.submit_button_text || defaultConfig.submit_button_text;
      }

      const backgroundColor = config.background_color || defaultConfig.background_color;
      const cardColor = config.card_color || defaultConfig.card_color;
      const primaryButtonColor = config.primary_button_color || defaultConfig.primary_button_color;
      const accentColor = config.accent_color || defaultConfig.accent_color;

      const container = document.querySelector('.form-container');
      if (container && config.background_color) {
        container.style.backgroundColor = backgroundColor;
      }
      const card = document.querySelector('.form-card');
      if (card && config.card_color) {
        card.style.backgroundColor = cardColor;
      }
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn && (config.primary_button_color || config.accent_color)) {
        submitBtn.style.background = `linear-gradient(to right, ${primaryButtonColor}, ${accentColor})`;
      }
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.card_color || defaultConfig.card_color,
            set: (value) => {
              config.card_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ card_color: value });
            }
          },
          {
            get: () => config.primary_button_color || defaultConfig.primary_button_color,
            set: (value) => {
              config.primary_button_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ primary_button_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.accent_color || defaultConfig.accent_color,
            set: (value) => {
              config.accent_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ accent_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["form_title", config.form_title || defaultConfig.form_title],
        ["subtitle", config.subtitle || defaultConfig.subtitle],
        ["submit_button_text", config.submit_button_text || defaultConfig.submit_button_text]
      ]);
    }

    // Initialize SDK and camera when ready
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }

    initCamera();

    // Cleanup camera when page unloads
    window.addEventListener('beforeunload', () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });

    // Disable right-click / context menu
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      return false;
    });

    // Disable text selection highlight except for editable inputs
    document.addEventListener('selectstart', (e) => {
      if (e.target.tagName !== 'INPUT' || e.target.readOnly) {
        e.preventDefault();
        return false;
      }
    });

    // Disable drag on all elements
    document.addEventListener('dragstart', (e) => {
      e.preventDefault();
      return false;
    });
  </script>
