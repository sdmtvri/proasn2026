      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      background: #1f2937;
      border-radius: 0.75rem;
      overflow: hidden;
      aspect-ratio: 4/3;

      width: 100%;
      height: 100%;

    }

    }

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      align-items: center;
      justify-content: center;

      color: white;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1.5rem;
      display: none;
      text-align: center;

    .error-message {

      color: white;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1.5rem;
      display: none;

    // Autocomplete Search for Nama Pegawai
    const namaInput = document.getElementById('nama');
    const namaDropdown = document.getElementById('namaDropdown');
    const namaContainer = document.getElementById('namaContainer');
    const clearNamaBtn = document.getElementById('clearNamaBtn');
    let highlightedIndex = -1;
    let currentFilteredNames = [];

    function openDropdown() {
      namaDropdown.classList.remove('hidden');
    }

    function closeDropdown() {
      namaDropdown.classList.add('hidden');
      highlightedIndex = -1;
    }

    function renderSuggestions(query = '') {
      const allNames = Object.keys(employeeDatabase);
      const q = query.trim().toLowerCase();

      // Filter by name or satker
      currentFilteredNames = q
        ? allNames.filter(n => {
          const emp = employeeDatabase[n];
          return n.toLowerCase().includes(q) || (emp && emp.satker.toLowerCase().includes(q));
        })
        : allNames;

      namaDropdown.innerHTML = '';
      highlightedIndex = -1;

      if (currentFilteredNames.length === 0) {
        namaDropdown.innerHTML = `
          <div class="px-4 py-3 text-sm text-gray-500 text-center">
            Nama pegawai tidak ditemukan
          </div>
        `;
        return;
      }

      const fragment = document.createDocumentFragment();
      currentFilteredNames.forEach((name, index) => {
        const emp = employeeDatabase[name];
        const item = document.createElement('div');
        item.className = 'suggestion-item px-4 py-2.5 hover:bg-purple-50 active:bg-purple-100 cursor-pointer transition-colors text-left';
        item.setAttribute('data-name', name);
        item.setAttribute('data-index', index);

        // Highlight matching query
        let displayName = name;
        if (q) {
          const matchIndex = name.toLowerCase().indexOf(q);
          if (matchIndex !== -1) {
            const before = name.substring(0, matchIndex);
            const match = name.substring(matchIndex, matchIndex + q.length);
            const after = name.substring(matchIndex + q.length);
            displayName = `${before}<mark class="bg-yellow-200 text-gray-900 rounded px-0.5">${match}</mark>${after}`;
          }
        }

        item.innerHTML = `
          <div class="font-semibold text-gray-800 text-sm">${displayName}</div>
          <div class="text-xs text-gray-500 truncate mt-0.5">${emp.satker} • ${emp.jabatan}</div>
        `;
        fragment.appendChild(item);
      });
      namaDropdown.appendChild(fragment);
    }

    function selectEmployee(name) {
      const emp = employeeDatabase[name];
      if (!emp) return;
      namaInput.value = name;
      document.getElementById('nip').value = emp.nip;
      document.getElementById('jabatan').value = emp.jabatan;
      document.getElementById('satker').value = emp.satker;
      clearNamaBtn.classList.remove('hidden');
      closeDropdown();
      showSuccess('Data pegawai berhasil dimuat!');
    }

    function updateHighlight(items) {
      items.forEach((item, idx) => {
        if (idx === highlightedIndex) {
          item.classList.add('bg-purple-100');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.classList.remove('bg-purple-100');
        }
      });
    }

    namaInput.addEventListener('focus', function () {
      renderSuggestions(this.value);
      openDropdown();
    });

    namaInput.addEventListener('input', function () {
      const val = this.value;
      if (val) {
        clearNamaBtn.classList.remove('hidden');
      } else {
        clearNamaBtn.classList.add('hidden');
      }

      if (employeeDatabase[val]) {
        const emp = employeeDatabase[val];
        document.getElementById('nip').value = emp.nip;
        document.getElementById('jabatan').value = emp.jabatan;
        document.getElementById('satker').value = emp.satker;
      } else {
        document.getElementById('nip').value = '';
        document.getElementById('jabatan').value = '';
        document.getElementById('satker').value = '';
      }

      renderSuggestions(val);
      openDropdown();
    });

    namaInput.addEventListener('keydown', function (e) {
      const items = namaDropdown.querySelectorAll('.suggestion-item');
      if (namaDropdown.classList.contains('hidden') || items.length === 0) {
        if (e.key === 'ArrowDown') {
          renderSuggestions(this.value);
          openDropdown();
        }
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        highlightedIndex = (highlightedIndex + 1) % items.length;
        updateHighlight(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        highlightedIndex = (highlightedIndex - 1 + items.length) % items.length;
        updateHighlight(items);
      } else if (e.key === 'Enter') {
        if (highlightedIndex >= 0 && highlightedIndex < items.length) {
          e.preventDefault();
          const selected = items[highlightedIndex].getAttribute('data-name');
          selectEmployee(selected);
        }
      } else if (e.key === 'Escape') {
        closeDropdown();
      }
    });

    // Handle suggestion click & prevent blur on desktop mouse click
    namaDropdown.addEventListener('mousedown', function (e) {
      e.preventDefault();
    });

    namaDropdown.addEventListener('click', function (e) {

      if (item) {
        selectEmployee(item.getAttribute('data-name'));

    });

      document.getElementById('satker').value = '';

      openDropdown();

    // Initialize camera
    async function initCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('cameraOverlay').style.display = 'flex';
        document.getElementById('cameraOverlay').innerHTML = '<span>Mengaktifkan kamera...</span>';

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: currentFacingMode },
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });
        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play().catch(() => { });
        document.getElementById('cameraOverlay').style.display = 'none';
      } catch (err) {
        console.error('Camera error:', err);
        document.getElementById('cameraOverlay').style.display = 'flex';
        document.getElementById('cameraOverlay').innerHTML = '<span>❌ Kamera tidak tersedia</span>';
        showError('Tidak dapat mengakses kamera. Pastikan Anda memberikan izin akses kamera.');
      }
    }

    // Switch camera (front <-> rear)
    document.getElementById('switchCameraBtn').addEventListener('click', async function () {
      const btn = this;
      btn.disabled = true;
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      await initCamera();
      btn.disabled = false;
    });

    // Capture photo
    document.getElementById('captureBtn').addEventListener('click', function () {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const context = canvas.getContext('2d');

      // Check if video is ready
      if (video.readyState !== video.HAVE_ENOUGH_DATA) {
        showError('Kamera belum siap. Silakan tunggu sebentar.');
        return;
      }

      // Set canvas size to match video
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      // Draw the current frame
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Convert to base64
      capturedImage = canvas.toDataURL('image/jpeg', 0.8);

      // Switch display
      video.style.display = 'none';
      canvas.style.display = 'block';
      document.getElementById('captureBtn').style.display = 'none';
      document.getElementById('switchCameraBtn').style.display = 'none';
      document.getElementById('retakeBtn').style.display = 'block';

      showSuccess('Foto berhasil diambil!');

      try {
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoi6AVfXtYhzTPXOpJ8pi0HGLxmzQ7iP_fiMBoX_vshitSlBrdih8czA_4M5nJB-BK/exec';

        const response = await fetch(GOOGLE_SCRIPT_URL, {

          body: JSON.stringify(formData)
        });

        showSuccess('Data berhasil dikirim ke Google Spreadsheet!');

        // Reset form
        document.getElementById('employeeForm').reset();
        clearNamaBtn.classList.add('hidden');
